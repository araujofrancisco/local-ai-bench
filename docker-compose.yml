name: local-ai-bench

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - DATABASE_URL=/data/benchmark.db
      - CONFIG_PATH=/config/default.yaml
    volumes:
      - ./config:/config
      - ./data:/data
      - ./plugins:/app/plugins
    restart: unless-stopped
