[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-bench"
version = "0.1.0"
description = "Local-first, plugin-based LLM benchmarking for Ollama hosts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
local-ai-bench = "local_ai_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["tests/", "web"]

# Built-in plugins are data-heavy benchmark definitions (heterogeneous case
# dicts, unannotated overrides). The `exclude` above cannot skip them because
# they are *imported* by the typed registry, so use a per-module override to
# keep them out of strict checking. They are covered behaviourally by unit
# tests instead (tests/unit/test_plugins.py, test_coding.py, test_runner.py).
[[tool.mypy.overrides]]
module = "local_ai_bench.plugins.builtin.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
