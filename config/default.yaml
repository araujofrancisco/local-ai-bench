# LocalAIBench configuration.
# Connect one or more Ollama servers under `hosts`. Each entry is a named
# Ollama base URL. The `local` entry below resolves to $OLLAMA_HOST (Docker
# Compose sets it to your host machine's Ollama automatically) or falls back to
# the default local Ollama (http://127.0.0.1:11434).
#
# To benchmark a second server, set the env var it references (e.g.
# LAB_SERVER_URL=http://192.168.10.108:11434) or edit `base_url` directly.
# A host whose required env var is unset makes the config fail with a clear
# message; comment the entry out to disable a server.
#
# Host values support ${VAR} and ${VAR:-default} expansion.
#
# Models are NOT listed here — they are auto-detected from each host by
# `GET /api/tags`. Choose which ones to benchmark at run time, e.g.:
#   local-ai-bench run --models 'qwen*'
#   local-ai-bench run --models llama3.2:latest,qwen2.5-coder:14b
#   local-ai-bench run --exclude '*:0.8b'
#   local-ai-bench run --interactive          # pick hosts, then models
#
# With no --models/--exclude/--interactive flags, every autodetected model on
# every configured host is benchmarked. There is no "models" section in this file.

hosts:
  - name: local
    base_url: ${OLLAMA_HOST:-http://127.0.0.1:11434}
  - name: lab-server
    base_url: ${LAB_SERVER_URL}
    timeout_seconds: 300
  # - name: gpu-node
  #   base_url: ${GPU_NODE_URL}
  #   timeout_seconds: 600

app:
  name: LocalAIBench
  output_dir: ./reports
  log_level: info

plugins:
  enabled:
    - smoke
    - reasoning
    - translation
    - summarization
    - structured_output
    - coding
    - vision
    - keyword
    - long_context
    - multi_context
    - rag
    - function_calling
    - multi_turn
    - agent_tool_use
    - safety_refusal
    - sql
    - multilingual
    - classification
  # Directory scanned for extra local plugins (.py files, e.g. ./plugins/keyword.py).
  # Inside the Docker container this is the mounted host directory ./plugins -> /app/plugins.
  local_dir: ./plugins
  # Plugin ids whose per-plugin score column appears by default on the Compare
  # page. Leave empty ([]) to show a score column for every enabled plugin that
  # ran; list specific ids to limit which columns appear by default.
  compare_default:
    - translation
    - coding
    - vision
    - summarization
    - reasoning
    - structured_output
    - long_context
    - rag
    - function_calling
    - multi_turn
    - agent_tool_use
    - safety_refusal
    - sql
    - multilingual
    - classification
  options:
    coding:
      # WARNING: executing code runs the model's generated solution in an
      # isolated subprocess (python -I). Only enable for code you trust.
      execute_code: true
      timeout_seconds: 30
      # Relative big-O checks: time the solution on a small and a large probe
      # and require large/small < perf_ratio_default so O(n^2) answers that
      # pass the small assertions are still penalized.
      enable_perf: true
      perf_ratio_default: 8.0
      # When a solution passes every executable check but a static AST scan
      # flags a known brute-force construct, deduct approach_penalty from the
      # case score so writing optimal code is rewarded.
      approach_penalty: 0.1
      # Optional LLM-as-judge code-quality blend weight (0 = disabled).
      judge_weight: 0.0
    vision:
      max_image_dimension: 768
    multi_context:
      prompt: "What is the capital of France?"
      expected: "paris"
      context_sizes: [512, 1024, 4096, 8192, 16384]
      contains: true
    rag:
      hallucination_penalty: 0.5
    function_calling:
      arg_tolerance: 0.5

runner:
  repetitions: 3
  warmup_runs: 1
  concurrency: 1
  temperature: 0.0
  seed: 42
  max_retries: 2
  retry_backoff_seconds: 2

# Judge used for subjective scoring by plugins that support it.
judge:
  enabled: false
  model: llama3.2:latest
  temperature: 0.0

context_optimization:
  enabled: true
  candidate_sizes:
    - 512
    - 1024
    - 2048
    - 4096
    - 8192
    - 16384
  max_candidate_size: 32768
  quality_threshold: 0.90
  latency_budget_ms: null
  needle_positions:
    - 0.1
    - 0.3
    - 0.5
    - 0.7
    - 0.9

reporting:
  formats:
    - json
    - markdown
    - html
  include_raw_cases: true

weights:
  translation: 1.0
  coding: 1.0
  vision: 1.0
  summarization: 1.0
  reasoning: 1.0
  structured_output: 1.0
  long_context: 1.0
  retrieval: 1.0
  function_calling: 1.0
  multi_turn: 1.0
  safety: 1.0
  sql: 1.0
  multilingual: 1.0
  classification: 1.0
